name: Repository Knowledge Indexer

on:
  workflow_dispatch:
    inputs:
      repository_id:
        description: 'Repository ID in IncidentPilot'
        required: true
        default: ''
      commit_sha:
        description: 'Commit SHA to index'
        required: false
        default: 'HEAD'
      target_repo:
        description: 'GitHub owner/repo slug of target repository'
        required: false
        default: ''
  push:
    branches: [ master, main ]

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent Code
        uses: actions/checkout@v4
        with:
          path: agent_code

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo || 'krishna3006b/ordering-system' }}
          path: target_repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent_code/requirements.txt sentence-transformers

      - name: Run Repository Indexer on Target Repo
        env:
          PYTHONPATH: agent_code
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          from app.agent.indexer import RepositoryIndexer
          repo_id = '${{ github.event.inputs.repository_id }}' if '${{ github.event.inputs.repository_id }}' else ''
          commit_sha = '${{ github.event.inputs.commit_sha }}' if '${{ github.event.inputs.commit_sha }}' else 'HEAD'
          indexer = RepositoryIndexer('target_repo', repo_id, commit_sha)
          res = indexer.index_repository()
          print(f'Indexing completed for target repository: {res}')
          "
