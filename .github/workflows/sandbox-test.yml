name: Isolated Patch Sandbox Validation

on:
  repository_dispatch:
    types: [validate_patch]
  workflow_dispatch:
    inputs:
      target_file:
        description: 'File path to patch'
        required: true
        default: 'src/app/api/checkout/route.ts'
      patch_code:
        description: 'Patch code content'
        required: true
      incident_id:
        description: 'Incident ID for callback'
        required: true
      callback_url:
        description: 'Backend callback URL'
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TARGET_FILE: ${{ github.event.client_payload.target_file || github.event.inputs.target_file }}
      PATCH_CODE: ${{ github.event.client_payload.patch_code || github.event.inputs.patch_code }}
      INCIDENT_ID: ${{ github.event.client_payload.incident_id || github.event.inputs.incident_id }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url || github.event.inputs.callback_url }}

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: 'krishna3006b/ordering-system'
          ref: ${{ github.event.client_payload.target_branch || github.event.inputs.target_branch || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install 2>/dev/null || echo "No package.json or install failed, continuing..."

      - name: Apply AI Candidate Patch
        run: |
          mkdir -p $(dirname "$TARGET_FILE")
          echo "$PATCH_CODE" > "$TARGET_FILE"
          echo "✅ Patch applied to $TARGET_FILE"
          echo "--- Patched file content ---"
          cat "$TARGET_FILE"

      - name: TypeScript Compilation Check
        id: tsc_check
        continue-on-error: true
        run: |
          if command -v npx &> /dev/null && [ -f tsconfig.json ]; then
            npx tsc --noEmit 2>&1 | head -50
            echo "TSC_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          else
            echo "No tsconfig.json found, skipping tsc check."
            echo "TSC_EXIT_CODE=0" >> $GITHUB_OUTPUT
          fi

      - name: Run Test Suite
        id: test_run
        continue-on-error: true
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test 2>&1 | tail -30
            echo "TEST_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          else
            echo "No test script found in package.json, skipping tests."
            echo "TEST_EXIT_CODE=0" >> $GITHUB_OUTPUT
          fi

      - name: Determine Verdict
        id: verdict
        run: |
          TSC="${{ steps.tsc_check.outputs.TSC_EXIT_CODE || '0' }}"
          TEST="${{ steps.test_run.outputs.TEST_EXIT_CODE || '0' }}"

          if [ "$TSC" = "0" ] && [ "$TEST" = "0" ]; then
            echo "VERDICT=PASS" >> $GITHUB_OUTPUT
            echo "✅ SANDBOX VERDICT: PASS"
          else
            echo "VERDICT=FAIL" >> $GITHUB_OUTPUT
            echo "❌ SANDBOX VERDICT: FAIL (tsc=$TSC, test=$TEST)"
          fi

      - name: Callback to Backend
        if: env.CALLBACK_URL != ''
        run: |
          VERDICT="${{ steps.verdict.outputs.VERDICT }}"
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"incident_id\": \"$INCIDENT_ID\",
              \"verdict\": \"$VERDICT\",
              \"target_file\": \"$TARGET_FILE\",
              \"run_id\": \"${{ github.run_id }}\",
              \"run_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" || echo "Callback failed, continuing..."
