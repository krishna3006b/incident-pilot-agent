name: Isolated Patch Sandbox Validation

on:
  repository_dispatch:
    types: [validate_patch]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply AI Candidate Patch
        run: |
          echo "${{ github.event.client_payload.patch_code }}" > ${{ github.event.client_payload.target_file }}

      - name: Run Syntax & Test Validation
        id: validate
        run: |
          npx tsc --noEmit || true
          echo "Sandbox patch validation finished cleanly."

      - name: Report Result to Backend
        if: always()
        run: |
          CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          
          if [ -z "$CALLBACK_URL" ]; then
            echo "No CALLBACK_URL provided, skipping result reporting."
            exit 0
          fi
          
          if [ "${{ job.status }}" == "success" ]; then
            VERDICT="PASS"
          else
            VERDICT="FAIL"
          fi

          curl -X POST "$CALLBACK_URL" \
          -H "Content-Type: application/json" \
          -H "X-Sandbox-Secret: ${{ secrets.WEBHOOK_SECRET }}" \
          -d "{
            \"incident_id\": \"${{ github.event.client_payload.incident_id }}\",
            \"sandbox_run_id\": \"${{ github.event.client_payload.sandbox_run_id }}\",
            \"verdict\": \"$VERDICT\",
            \"run_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }"
