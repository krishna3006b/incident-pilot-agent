name: Isolated Patch Sandbox Validation

on:
  repository_dispatch:
    types: [validate_patch]
  workflow_dispatch:
    inputs:
      target_file:
        description: 'File path to patch'
        required: true
        default: ''
      patch_code:
        description: 'Patch code content'
        required: true
      incident_id:
        description: 'Incident ID for callback'
        required: true
      callback_url:
        description: 'Backend callback URL'
        required: false
      setup_command:
        description: 'Command to setup environment (e.g. actions/setup-node)'
        required: false
      build_command:
        description: 'Command to build the project'
        required: false
      test_command:
        description: 'Command to run tests'
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TARGET_FILE: ${{ github.event.client_payload.target_file || github.event.inputs.target_file }}
      PATCH_CODE: ${{ github.event.client_payload.patch_code || github.event.inputs.patch_code }}
      INCIDENT_ID: ${{ github.event.client_payload.incident_id || github.event.inputs.incident_id }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url || github.event.inputs.callback_url }}
      SETUP_COMMAND: ${{ github.event.client_payload.setup_command || github.event.inputs.setup_command || 'npm install' }}
      BUILD_COMMAND: ${{ github.event.client_payload.build_command || github.event.inputs.build_command || 'npx tsc --noEmit' }}
      TEST_COMMAND: ${{ github.event.client_payload.test_command || github.event.inputs.test_command || 'npm test' }}

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.target_repo || 'krishna3006b/ordering-system' }}
          ref: ${{ github.event.client_payload.target_branch || github.event.inputs.target_branch || 'main' }}

      - name: Apply AI Candidate Patch
        run: |
          mkdir -p $(dirname "$TARGET_FILE")
          echo "$PATCH_CODE" > "$TARGET_FILE"
          echo "✅ Patch applied to $TARGET_FILE"
          echo "--- Patched file content ---"
          cat "$TARGET_FILE"

      - name: Setup & Install Dependencies
        run: |
          if [ -n "$SETUP_COMMAND" ]; then
            bash -c "$SETUP_COMMAND" 2>/dev/null || echo 'Setup command failed or returned non-zero, continuing...'
          fi

      - name: Build / Compile Check
        id: build_check
        continue-on-error: true
        run: |
          if [ -n "$BUILD_COMMAND" ]; then
            bash -c "$BUILD_COMMAND" 2>&1 | head -50
            echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          else
            echo "No build command specified."
            echo "BUILD_EXIT_CODE=0" >> $GITHUB_OUTPUT
          fi

      - name: Run Test Suite
        id: test_run
        continue-on-error: true
        run: |
          if [ -n "$TEST_COMMAND" ]; then
            bash -c "$TEST_COMMAND" 2>&1 | tail -30
            echo "TEST_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          else
            echo "No test command specified."
            echo "TEST_EXIT_CODE=0" >> $GITHUB_OUTPUT
          fi

      - name: Determine Verdict
        id: verdict
        run: |
          BUILD="${{ steps.build_check.outputs.BUILD_EXIT_CODE || '0' }}"
          TEST="${{ steps.test_run.outputs.TEST_EXIT_CODE || '0' }}"

          if [ "$BUILD" = "0" ] && [ "$TEST" = "0" ]; then
            echo "VERDICT=PASS" >> $GITHUB_OUTPUT
            echo "✅ SANDBOX VERDICT: PASS"
          else
            echo "VERDICT=FAIL" >> $GITHUB_OUTPUT
            echo "❌ SANDBOX VERDICT: FAIL (build=$BUILD, test=$TEST)"
          fi

      - name: Callback to Backend
        if: env.CALLBACK_URL != ''
        run: |
          VERDICT="${{ steps.verdict.outputs.VERDICT }}"
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"incident_id\": \"$INCIDENT_ID\",
              \"verdict\": \"$VERDICT\",
              \"target_file\": \"$TARGET_FILE\",
              \"run_id\": \"${{ github.run_id }}\",
              \"run_url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" || echo "Callback failed, continuing..."
